<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RADIX responsive QA</title><style>body{margin:0;background:#06110d;color:#eafff5;font:14px system-ui}header{padding:12px;position:sticky;top:0;background:#06110d;z-index:2}button{padding:10px;margin:4px;background:#123f2e;color:white;border:1px solid #65ac89;border-radius:8px}main{overflow:auto;padding:8px}iframe{height:900px;border:1px solid #3b745b;background:#030906}output{margin-left:12px}</style><header>Preview reale, nessun dato simulato <button data-width="390">Telefono 390</button><button data-width="768">Tablet 768</button><button data-width="1440">Desktop 1440</button><output>390 px</output></header><main><iframe title="Command Center responsive" src="../control-center-v2.html" width="390"></iframe></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').width=b.dataset.width;document.querySelector('output').textContent=b.dataset.width+' px'})</script></html>
