<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/ciuffo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ciuffo/ciuffo.css">
<title>Prova Ciuffo gratis</title>
</head>
<body>
<main class="narrow" style="padding:28px 16px 48px">
 <div class="brandbar"><a href="/ciuffo/"><img src="/ciuffo/logo.svg" alt="Ciuffo"></a></div>
 <section class="card" style="padding:24px">
  <h1 style="font-size:1.9rem">Attiva Ciuffo per il tuo salone</h1>
  <p class="muted">Due minuti: dopo trovi già orari tipici e quattro servizi di esempio, da cambiare come vuoi.</p>
  <form id="f" novalidate>
   <div class="field"><label for="shop">Nome del salone</label><input id="shop" required maxlength="120" placeholder="Salone Bea"></div>
   <div class="field"><label for="kind">Che attività è?</label><select id="kind"><option value="parrucchiere">Parrucchiere</option><option value="barbiere">Barbiere</option><option value="estetista">Centro estetico</option><option value="unghie">Unghie</option><option value="altro">Altro</option></select></div>
   <div class="field"><label for="city">Città</label><input id="city" maxlength="80" autocomplete="address-level2"></div>
   <div class="field"><label for="tel">Telefono del salone</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel"></div>
   <div class="field"><label for="name">Il tuo nome e cognome</label><input id="name" required autocomplete="name"></div>
   <div class="field"><label for="email">La tua email</label><input id="email" type="email" required autocomplete="email"></div>
   <div class="field"><label for="pw">Scegli una password <span class="muted small">(almeno 10 caratteri)</span></label><input id="pw" type="password" minlength="10" required autocomplete="new-password"></div>
   <label class="check"><input type="checkbox" id="ok"> <span>Accetto le condizioni della prova gratuita: il servizio è in prova, senza costi e senza impegno; posso chiedere di cancellare il mio salone in ogni momento. I dati dei clienti restano del salone (<a href="/ciuffo/privacy.html" target="_blank" rel="noopener">informativa</a>).</span></label>
   <p id="err" class="notice err hidden" role="alert" style="margin-top:14px"></p>
   <button class="btn" style="width:100%;margin-top:16px" id="go">Crea la mia agenda</button>
  </form>
  <p class="small muted" style="margin-top:16px">Hai già un account? <a href="/ciuffo/accedi.html">Accedi</a></p>
 </section>
</main>
<script src="/ciuffo/ciuffo.js"></script>
<script>
const v=id=>document.getElementById(id).value;
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err'),go=document.getElementById('go');err.classList.add('hidden');go.disabled=true;
 try{await Ciuffo.api('POST',null,{action:'auth.signup',data:{name:v('name'),email:v('email'),password:v('pw'),accept:document.getElementById('ok').checked,shop:{name:v('shop'),kind:v('kind'),city:v('city')||undefined,phone:v('tel')||undefined}}});location.href='/ciuffo/app/?benvenuto=1';}
 catch(x){err.textContent=x.message;err.classList.remove('hidden');go.disabled=false;}});
</script>
</body>
</html>
